[theme]
base = "dark"
primaryColor = "#2E6275"
backgroundColor = "#0E1419"
secondaryBackgroundColor = "#172026"
textColor = "#F8F9FA"
linkColor = "#4A7384"
linkUnderline = false
borderColor = "#2C3942"
dataframeBorderColor = "#2C3942"
dataframeHeaderBackgroundColor = "#172026"
showWidgetBorder = true
baseRadius = "0.625rem"
buttonRadius = "0.5rem"
baseFontSize = 15
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
codeFontSize = "0.8rem"
# Actualizado con azul claro, terracota (peligro) y gris suave
chartCategoricalColors = ["#4A7384", "#C27A5C", "#8A9499"]

# Inter se sirve desde la propia app: la tipografia no depende de Google Fonts
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fuentes/inter-latin-400-normal.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fuentes/inter-latin-500-normal.woff2"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fuentes/inter-latin-600-normal.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fuentes/inter-latin-700-normal.woff2"
weight = "700"
style = "normal"

[server]
maxUploadSize = 5
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false